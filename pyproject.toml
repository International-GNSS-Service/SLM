[project]
name = "igs-slm"
version = "0.5.0b0"
description = "IGS Site Log Manager"
requires-python = ">=3.11,<4.0"
authors = [
  {name = "Brian Kohan", email = "bkohan@jpl.nasa.gov"},
  {name = "Ashley Santiago", email = "ashley.k.santiago@jpl.nasa.gov"},
  {name = "Robert Khachikyan", email = "robert.khachikyan@jpl.nasa.gov"}
]
license = "MIT"
license-files = [ "LICENSE" ]
repository = "https://github.com/International-GNSS-Service/SLM"
homepage = "https://igs-slm.readthedocs.io"
readme = "README.md"
keywords = [
    "SLM",
    "Site Log Manager",
    "IGS",
    "International GNSS Service",
    "GNSS",
    "GPS",
    "GLONASS",
    "Galileo",
    "BeiDou",
    "QZSS"
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "Django>=5.2,<6.0",
    "django-split-settings>=1.3.2,<2.0.0",
    "django-allauth>=65.4",
    "django-widget-tweaks>=1.5.0,<2.0.0",
    "djangorestframework>=3.16.0,<4.0.0",
    "django-render-static>=3.3.0,<4.0.0",
    "django-filter>=25.1,<27.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "django-ipware>=7.0.1,<9.0.0",
    "django-enum>=2.2.0,<3.0.0",
    "enum-properties>=2.3.0,<3.0.0",
    "tqdm>=4.67.0,<5.0.0",
    "geojson>=3.2.0,<4.0.0",
    "Pillow>=11.0.0,<13.0.0",
    "polyline>=2.0.2,<3.0.0",
    "lxml>=6.0.1,<7.0.0",
    "django-polymorphic>=4.1.0,<5.0",
    "Jinja2>=3.1.6,<4.0.0",
    "django-ckeditor>=6.7.2,<7.0.0",
    "django-crispy-forms>=2.4,<3.0.0",
    "crispy-bootstrap5>=2025.4",
    "djangorestframework-gis>=1.1,<2.0.0",
    "chardet>=5.2.0,<8.0.0",
    "psycopg>=3.2",
    "django-typer>=4.1.1,<5.0.0",
    "django-routines>=1.6.0,<2.0.0",
    "rich>=14.0.0,<16.0.0",
    "requests>=2.32.4,<3.0.0",
    "packaging>=24.2",
    "django-compressor>=4.5.1",
    "django-environ>=0.12.0",
    "django-hijack>=3.6.2",
]

[project.optional-dependencies]
gunicorn = ["gunicorn>=23.0.0"]
debug = [
    "ipdb>=0.13.13,<1.0.0",
    "django-debug-toolbar>=5.0.0",
    "django-extensions>=3.2.3",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
"Homepage" = "https://igs-slm.readthedocs.io"
"Documentation" = "https://igs-slm.readthedocs.io"
"Repository" = "https://github.com/International-GNSS-Service/SLM"
"Issues" = "https://github.com/International-GNSS-Service/SLM/issues"
"Changelog" = "https://igs-slm.readthedocs.io/en/latest/changelog.html"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/slm",
    "src/igs_tools"
]

[project.scripts]
slm-startproject = 'slm.bin.startproject:app'
slm = "slm.manage:main"

[dependency-groups]
docs = [
    "doc8>=1.1.2",
    "furo>=2024.8.6",
    "readme-renderer[md]>=44.0",
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-django>=2.5",
    "sphinxcontrib-typer[html,pdf,png]>=0.10.0",
    "sphinxcontrib-svg2pdfconverter[cairosvg]>=1.2.3",
    "sphinxcontrib-spelling>=8.0.0",
    "pyenchant>=3.2.2",
]
typing = [
    "pyright>=1.1.390",
    "mypy>=1.19.1",
    "django-stubs[compatible-mypy]>=5.1.3",
    "django-stubs-ext>=5.1.3",
]
lint = [
    "ruff>=0.15.0",
    "readme-renderer[md]>=43.0",
    "doc8>=1.1.2",
    "djlint>=1.36.4",
    "bandit[toml,sarif]>=1.7.10",
]
coverage = ["coverage[toml]>=7.6.1"]
test = [
    { include-group = "coverage" },
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.10.0",
    "pytest-env>=1.1.5",
    "django-test-migrations>=1.4.0",
    "django-extensions>=3.2.3",
    "whitenoise>=6.8.0",
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.0",
]
dev = [
    { include-group = "typing" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
    "django-debug-toolbar>=5.0.0",
    "packaging>=24.2",
    "tomlkit>=0.13.3",
    "ipdb>=0.13.13",
    "ipython>=8.18.1",
    "pydot>=3.0.0",
    "pyparsing>=3.2.0",
    "pygount>=1.8.0",
]

# todo doc8 configuration here is not being picked up and doesnt seem to be working
# as expected - for now pass these parameters manually
[tool.doc8]
max-line-length = 100
sphinx = true


[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
# allow_redefinition = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
mypy_path = ["src"]
packages = ["slm"]
exclude = ["src/slm/bin/templates"]

[tool.django-stubs]
django_settings_module = "tests.settings"


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/slm"]
exclude = ["src/slm/bin/templates"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportDuplicateImport = true

[tool.pytest.ini_options]
# py.test options:
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test*.py"
norecursedirs = "*.egg .eggs dist build docs .tox .git __pycache__"
env = [
    "TERMINAL_WIDTH=80",
]
markers = [
    "e2e: Playwright browser tests against a live server (deselect with '-m \"not e2e\"')",
]

# upstream typer has deprecated shell_complete in favor of autocomplete, but
# has not updated the autocomplete interface.
# https://github.com/fastapi/typer/pull/1006
filterwarnings = [
    "ignore:.*shell_complete.*:DeprecationWarning:typer.core"
]

addopts = [
  "--strict-markers",
  "--cov=slm",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered"
]

[tool.coverage.run]
omit = [
  "tests/**/*.py"
]
branch = true
source = ["slm"]
concurrency = ["thread", "multiprocessing"]
parallel = true
relative_files = true
command_line = "-m pytest --cov=slm"

[tool.coverage.paths]
source = [
    "slm"
]

[tool.ruff]
line-length = 88
exclude = [
    "doc",
    "dist",
    "igs_tools",
    "src/slm/bin/templates"
]
target-version = "py311"

[tool.ruff.lint]
exclude = ["tests/**/*"]
# ruff < 0.17 default rules - todo adopt the expanded default rule set
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
targets = ["src"]
exclude_dirs = [
    "./tests",
    "./.venv",
    "./doc",
]

skips = [
    "B101",  # assert_used - assertions are fine in tests and Django code
    "B110",  # Try, Except, Pass detected - these are intentional
]

# Severity level threshold
# Options: LOW, MEDIUM, HIGH
severity = "MEDIUM"

# Confidence level threshold
# Options: LOW, MEDIUM, HIGH
confidence = "MEDIUM"
