name: Safety

permissions:
  contents: read

concurrency:
  group: safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".safety-policy.yml"
      - ".github/workflows/safety.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *" # Runs at 6 am pacific every day

jobs:
  safety:
    runs-on: ubuntu-latest
    environment:
      name: safety
      deployment: false # Prevents creating a GitHub deployment object
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - name: Refresh Requirements
        run: |
          uv export --no-dev --all-extras --no-hashes --no-emit-project > requirements.txt
      - uses: pyupio/safety-action@7baf6605473beffc874c1313ddf2db085c0cacf2 # v1
        with:
          api-key: ${{ secrets.SAFETY_API_KEY }}
